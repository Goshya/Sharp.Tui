name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # macOS is deliberately absent: raw terminal mode isn't supported there yet (#31).
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Sharp.Tui.sln -c Release -warnaserror

      - name: Test
        # --blame-hang names the test that never finished instead of the job just timing out.
        run: dotnet test Sharp.Tui.sln -c Release --no-build --blame-hang --blame-hang-timeout 2m --logger "console;verbosity=normal"
